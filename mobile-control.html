<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>棒球计分 · 手机控制</title>
<style>
  :root{
    --bg:#0b1220; --card:#151f31; --card2:#1b2940; --line:#2c3a52;
    --text:#eef4ff; --muted:#9db0cc; --brand:#3d7bff; --brand2:#1a56c4;
    --ok:#43d39a; --warn:#ffbd66; --white:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       overscroll-behavior-y:contain;-webkit-text-size-adjust:100%}
  button,input{font:inherit;color:inherit}
  button{touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;border:0;
         background:none;transition:transform .08s ease,background .12s ease,border-color .12s ease}
  button:active:not(:disabled){transform:scale(.96)}
  button:disabled{opacity:.38;cursor:not-allowed}
  input{font-size:16px;background:#0e1829;border:1px solid var(--line);border-radius:12px;
        padding:12px 14px;min-height:50px;width:100%;outline:none;touch-action:manipulation}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,123,255,.18)}
  input[readonly]{color:var(--muted)}
  .app{max-width:720px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.96);backdrop-filter:blur(8px);
          padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
  .tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#26344c;color:var(--muted)}
  .tag.on{background:rgba(67,211,154,.16);color:var(--ok)}
  .tag.read{background:rgba(255,189,102,.16);color:var(--warn)}
  .link{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:19px;word-break:break-all}
  .link.on{color:var(--ok)}
  .link.off{color:var(--warn)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;
              font-size:14px;font-weight:700;color:#bcd2f5;letter-spacing:.3px;margin-bottom:10px}
  .card-title .mini{font-size:13px;color:var(--muted);border:1px solid var(--line);
                    border-radius:10px;padding:8px 12px;min-height:44px;background:var(--card2)}
  .lbl{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 6px}
  .input-row{display:flex;gap:8px;align-items:center}
  .input-row input{flex:1;min-width:0;letter-spacing:1px;text-transform:uppercase}
  .input-row .mini{flex:none;min-height:50px;padding:0 16px;border:1px solid var(--line);
                   border-radius:12px;background:var(--card2);color:var(--text);font-size:14px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scroll-snap-type:x mandatory;
         -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start;min-height:54px;padding:8px 14px;border-radius:14px;
        background:var(--card2);border:1px solid var(--line);text-align:left;letter-spacing:1px;font-weight:700}
  .chip small{display:block;font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:2px}
  .chip.on{border-color:var(--brand);background:rgba(61,123,255,.16)}
  .chip.locked small{color:var(--warn)}
  .empty{font-size:12.5px;color:var(--muted);padding:8px 2px}
  .btn-grid{display:grid;gap:10px;margin-top:12px}
  .btn-grid.two{grid-template-columns:1fr 1fr}
  .btn-grid.three{grid-template-columns:repeat(3,1fr)}
  .btn{min-height:54px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
       font-size:15px;font-weight:600;padding:10px 8px}
  .btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff;min-height:56px;font-size:16px}
  .btn.ghost{background:transparent}
  .btn.warn{border-color:rgba(255,189,102,.45);color:var(--warn)}
  .btn.on{background:var(--white);border-color:var(--white);color:#0b1220}
  .hint{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.6}
  .hint.warn{color:var(--warn)}
  .stage{background:#0a1120;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:16/9}
  .stage svg{display:block;width:100%;height:100%}
  .team{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
  .team:last-child{margin-bottom:0}
  .team-name{display:flex;align-items:center;gap:10px}
  .team-name label{flex:0 0 46px;font-size:13px;color:var(--muted)}
  .team-name input{min-height:46px;font-weight:700;letter-spacing:.5px}
  .score-line{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
  .step{width:60px;height:60px;flex:none;border-radius:16px;background:#243552;border:1px solid #38496a;
        font-size:30px;font-weight:700;line-height:1;color:var(--text)}
  .score{font:700 34px/1 Consolas,Menlo,monospace;min-width:74px;text-align:center;color:#fff}
  .unit{font-size:13px;color:var(--muted)}
  .inline{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 12px}
  .inline .step{width:54px;height:54px;font-size:26px}
  .inline output{font:700 28px/1 Consolas,Menlo,monospace;min-width:64px;text-align:center}
  .seg{display:flex;gap:8px}
  .seg .btn{flex:1;min-height:52px}
  .count-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .count-row:last-child{margin-bottom:0}
  .count-label{flex:0 0 66px;font-size:13px;color:var(--muted)}
  .dots{display:flex;gap:8px;flex:1}
  .dot{flex:1;min-width:0;min-height:56px;border-radius:16px;background:var(--card2);
       border:1px solid var(--line);font:700 20px/1 Consolas,Menlo,monospace;color:var(--muted)}
  .dot.on{background:var(--white);border-color:var(--white);color:#0b1220;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
  .bases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .base{min-height:76px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
        font-size:13px;color:var(--muted);padding:8px 4px}
  .base i{display:block;width:22px;height:22px;margin:0 auto 6px;transform:rotate(45deg);
          border:2px solid #7c8aa5;border-radius:3px;background:transparent}
  .base.on{color:#fff;border-color:rgba(255,255,255,.5)}
  .base.on i{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
  .switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:12px}
  .switch input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--brand)}
  details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  summary{font-size:13px;color:var(--muted);min-height:40px;display:flex;align-items:center}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,18,32,.97);
             border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
             display:grid;grid-template-columns:repeat(3,1fr);gap:8px;backdrop-filter:blur(8px)}
  .bottombar button{min-height:50px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
                    font-size:13px;font-weight:600;color:var(--text);padding:6px 4px}
  .bottombar button:first-child{background:var(--brand2);border-color:var(--brand2);color:#fff}
  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
         z-index:30;max-width:90vw;background:#243552;border:1px solid #4a6086;color:#fff;
         border-radius:12px;padding:10px 16px;font-size:13px;line-height:1.5;opacity:0;
         pointer-events:none;transition:opacity .2s ease;text-align:center}
  #toast.show{opacity:1}
  .credit{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.8;margin:16px 0 4px}
  .credit a{color:#8ab4ff;text-decoration:none}
  #controlArea.locked-ui{opacity:.55}
  @media (min-width:700px){
    .app{max-width:900px}
    main{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
    .card{margin-bottom:0}
    .preview-card{grid-column:1 / -1}
    #roomCard{grid-column:1 / -1}
    #controlArea{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
    .bottombar{left:50%;transform:translateX(-50%);width:900px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span>棒球计分 · 手机控制</span><span class="tag" id="roleTag">未连接</span></div>
    <div class="link off" id="linkInfo">未连接 · 选择或输入房间号后加入</div>
  </header>

  <main>
    <section class="card preview-card">
      <div class="card-title">记分条实时预览 <span class="unit" id="roomLabel">未加入房间</span></div>
      <div class="stage"><svg id="preview" viewBox="0 0 1000 562.5" preserveAspectRatio="xMidYMid meet"></svg></div>
    </section>

    <section class="card" id="roomCard">
      <div class="card-title">① 加入房间 <button class="mini" data-act="refresh" id="btnRefreshRooms">刷新房间</button></div>
      <label class="lbl" for="roomInput">房间号（4–12 位字母 / 数字，留空自动新建）</label>
      <div class="input-row">
        <input id="roomInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters"
               spellcheck="false" maxlength="12" placeholder="例如 ABC123">
        <button class="mini" data-act="random">随机</button>
      </div>
      <div class="lbl">当前在线房间（点一下直接加入）</div>
      <div class="chips" id="roomChips"><span class="empty">正在读取房间列表…</span></div>
      <label class="lbl" for="keyInput">控制密钥（留空＝只读观看；填密钥才能改比分）</label>
      <div class="input-row">
        <input id="keyInput" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"
               placeholder="从桌面控制器复制">
        <button class="mini" data-act="toggleKey" id="btnToggleKey">显示</button>
      </div>
      <div class="btn-grid two">
        <button class="btn primary" data-act="join" id="btnJoin">加入房间</button>
        <button class="btn ghost" data-act="leave" id="btnLeave">断开</button>
      </div>
      <label class="switch"><input type="checkbox" id="vibrate"> 点击时轻微振动反馈</label>
      <details>
        <summary>高级：中继地址</summary>
        <label class="lbl" for="serverInput">一般无需修改；从线上服务打开时自动用当前站点</label>
        <input id="serverInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://…">
      </details>
      <p class="hint" id="roomHint">房间号由服务端绑定，不同房间互不干扰。只读观看不需要密钥；要控制已有房间，请在桌面控制器复制控制密钥后填入。</p>
    </section>

    <div class="ctl-only" id="controlArea">
      <section class="card">
        <div class="card-title">② 比分与局数</div>
        <div class="team">
          <div class="team-name"><label for="awayName">客队</label><input id="awayName" type="text" maxlength="10" spellcheck="false"></div>
          <div class="score-line">
            <button class="step" data-act="score" data-field="awayScore" data-delta="-1" aria-label="客队减一分">−</button>
            <output class="score" id="awayScore">0</output>
            <button class="step" data-act="score" data-field="awayScore" data-delta="1" aria-label="客队加一分">+</button>
            <span class="unit">分</span>
          </div>
        </div>
        <div class="team">
          <div class="team-name"><label for="homeName">主队</label><input id="homeName" type="text" maxlength="10" spellcheck="false"></div>
          <div class="score-line">
            <button class="step" data-act="score" data-field="homeScore" data-delta="-1" aria-label="主队减一分">−</button>
            <output class="score" id="homeScore">0</output>
            <button class="step" data-act="score" data-field="homeScore" data-delta="1" aria-label="主队加一分">+</button>
            <span class="unit">分</span>
          </div>
        </div>
        <div class="inline">
          <button class="step" data-act="inning" data-delta="-1" aria-label="局数减一">−</button>
          <output id="inningVal">1</output>
          <button class="step" data-act="inning" data-delta="1" aria-label="局数加一">+</button>
          <span class="unit">局</span>
        </div>
        <div class="seg" id="halfSeg">
          <button class="btn" data-act="half" data-half="top">上半局 ▲</button>
          <button class="btn" data-act="half" data-half="bottom">下半局 ▼</button>
        </div>
      </section>

      <section class="card">
        <div class="card-title">③ 球数 / 出局 / 垒包</div>
        <div class="count-row"><span class="count-label">B 坏球</span><div class="dots" id="ballDots"></div></div>
        <div class="count-row"><span class="count-label">S 好球</span><div class="dots" id="strikeDots"></div></div>
        <div class="count-row"><span class="count-label">出局</span><div class="dots" id="outDots"></div></div>
        <div class="bases" id="bases" style="margin-top:12px">
          <button class="base" data-act="base" data-field="b1"><i></i>一垒</button>
          <button class="base" data-act="base" data-field="b2"><i></i>二垒</button>
          <button class="base" data-act="base" data-field="b3"><i></i>三垒</button>
        </div>
      </section>

      <section class="card">
        <div class="card-title">④ 一键打点</div>
        <div class="btn-grid two">
          <button class="btn" data-act="quick" data-kind="ball1">坏球 +1</button>
          <button class="btn" data-act="quick" data-kind="strike1">好球 +1</button>
          <button class="btn" data-act="quick" data-kind="out1">出局 +1</button>
          <button class="btn" data-act="quick" data-kind="clearCount">清空球数</button>
          <button class="btn" data-act="quick" data-kind="clearBases">清空垒包</button>
          <button class="btn warn" data-act="quick" data-kind="nextHalf">换半局／重置</button>
        </div>
      </section>

      <section class="card">
        <div class="card-title">⑤ 视频时间同步 <span class="unit" id="tVal">00:00</span></div>
        <div class="btn-grid three">
          <button class="btn" data-act="time" data-delta="-5">−5 秒</button>
          <button class="btn" data-act="time" data-delta="0">同步时间</button>
          <button class="btn" data-act="time" data-delta="5">+5 秒</button>
        </div>
        <p class="hint">叠加层勾选「跟随控制器时间」时才会跟随这里的秒数。</p>
      </section>
    </div>
  </main>

  <footer class="bottombar">
    <button data-act="syncNow">立即同步状态</button>
    <button data-act="copyOverlay">复制叠加层地址</button>
    <button data-act="copyMobile">复制本页地址</button>
  </footer>
  <p class="credit">项目作者 狗王IB · <a href="https://space.bilibili.com/150585" target="_blank" rel="noopener noreferrer">B 站主页</a> · <a href="https://github.com/2BSB/baseball-scorebug-bas/issues" target="_blank" rel="noopener noreferrer">GitHub 留言</a> / B 站后台私信反馈</p>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* 棒球实时计分 · BAS 高级弹幕生成器 v2
 * 依据 https://bilibili.github.io/bas/#/guide 语法：def text / def path / set / then / duration
 * 同一份几何数据同时产出 BAS 脚本与 SVG 预览，保证预览与弹幕一致。
 *
 * v2 变化：
 *  1. 右下角原「四个大数字圆圈」模块取消，改成 B / S 上下两行独立记数（圆点 + 数字）。
 *  2. 队伍名称所在行的底色、文字色，以及上垒菱形高亮色均可在生成时自定义（默认上垒为纯白）。
 *  3. 位置模块支持左上 / 右上 / 左下 / 右下四种贴角预设，右下角会按宽度自动换算 Y，不越界。
 *  4. 右下角 B / S 两行底色统一为可配置的「球数行底色」（默认纯黑 #0B0B0C），空点统一暗灰。
 */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  if (root) root.ScorebugBAS = api;
})(typeof window !== 'undefined' ? window : null, function () {
  'use strict';

  var BOARD_W = 520, BOARD_H = 163;          // 计分条内部坐标（与参考图 520x163 一致）
  var STAGE_W = 1000, STAGE_H = 562.5;      // 16:9 播放器参考舞台

  var COLOR = {
    frame:       0xC9CBD2,
    bg:          0x0B0B0C,
    blue:        0x2C51C2,
    darkRight:   0x191B1F,
    line:        0xCBD1DC,
    midLine:     0x4A4C55,
    baseOff:     0x2B2C36,
    baseEdge:    0xC9CFD8,
    outOff:      0x3D3C47,
    ballOff:     0x585E6C,   // B / S 黑色行上的空点（统一暗灰，避免与点亮白点混淆）
    strikeOff:   0x585E6C,   // 好球行改黑底后与坏球行一致
    countOn:     0xFFFFFF,   // 球数点亮统一用纯白
    arrowOff:    0x55565F,
    arrowOn:     0xFFFFFF,
    white:       0xFFFFFF
  };

  var DEFAULT_STATE = {
    awayName: 'ARI', homeName: 'LAD',
    awayScore: 4, homeScore: 4,
    inning: 5, half: 'bottom',
    b1: 1, b2: 1, b3: 1,
    outs: 0, balls: 1, strikes: 2
  };

  var DEFAULT_OPTIONS = {
    widthPct: 52,
    xPct: 3,
    yPct: 4,
    anchor: 'br',        // custom | tl | tr | bl | br —— 默认贴右下角
    marginPct: 2,        // 贴角留白（占播放器百分比）
    duration: '2h',
    awayBg: '#0B0B0C',   // 客队名称行底色（可变色）
    awayFg: '#FFFFFF',   // 客队名称 / 比分文字色
    homeBg: '#2C51C2',   // 主队名称行底色（可变色）
    homeFg: '#FFFFFF',   // 主队名称 / 比分文字色
    countBg: '#0B0B0C',  // 右下角 B / S 球数行底色（两行统一，默认黑色）
    baseOn: '#FFFFFF',   // 上垒菱形高亮色（纯白更清楚）
    fontScale: 100,      // 全部文字字号百分比
    nameScoreScale: 100, // 队名 / 比分字号百分比（两位数比分防挤）
    autoFit: true        // 队名与比分超宽时自动缩小，留出间隙
  };

  var EVENT_FIELDS = [
    { key: 'awayName',  label: '客队名称', kind: 'text' },
    { key: 'homeName',  label: '主队名称', kind: 'text' },
    { key: 'awayScore', label: '客队比分', kind: 'int' },
    { key: 'homeScore', label: '主队比分', kind: 'int' },
    { key: 'inning',    label: '局数',     kind: 'int' },
    { key: 'half',      label: '半局',     kind: 'half' },
    { key: 'b1',        label: '一垒有人', kind: 'bool' },
    { key: 'b2',        label: '二垒有人', kind: 'bool' },
    { key: 'b3',        label: '三垒有人', kind: 'bool' },
    { key: 'outs',      label: '出局数',   kind: 'int' },
    { key: 'balls',     label: '坏球数 B', kind: 'int' },
    { key: 'strikes',   label: '好球数 S', kind: 'int' }
  ];

  /* ---------- SVG path 工具 ---------- */
  function n(v) { return Math.round(v * 100) / 100; }
  function rect(x, y, w, h) {
    return 'M' + n(x) + ',' + n(y) + ' H' + n(x + w) + ' V' + n(y + h) + ' H' + n(x) + ' Z';
  }
  function roundRect(x, y, w, h, r) {
    return 'M' + n(x + r) + ',' + n(y) + ' H' + n(x + w - r) + ' Q' + n(x + w) + ',' + n(y) + ' ' + n(x + w) + ',' + n(y + r) +
      ' V' + n(y + h - r) + ' Q' + n(x + w) + ',' + n(y + h) + ' ' + n(x + w - r) + ',' + n(y + h) +
      ' H' + n(x + r) + ' Q' + n(x) + ',' + n(y + h) + ' ' + n(x) + ',' + n(y + h - r) +
      ' V' + n(y + r) + ' Q' + n(x) + ',' + n(y) + ' ' + n(x + r) + ',' + n(y) + ' Z';
  }
  function bottomRoundRect(x, y, w, h, r) {
    return 'M' + n(x) + ',' + n(y) + ' H' + n(x + w) + ' V' + n(y + h - r) +
      ' Q' + n(x + w) + ',' + n(y + h) + ' ' + n(x + w - r) + ',' + n(y + h) +
      ' H' + n(x + r) + ' Q' + n(x) + ',' + n(y + h) + ' ' + n(x) + ',' + n(y + h - r) + ' Z';
  }
  function diamond(cx, cy, h) {
    return 'M' + n(cx) + ',' + n(cy - h) + ' L' + n(cx + h) + ',' + n(cy) +
      ' L' + n(cx) + ',' + n(cy + h) + ' L' + n(cx - h) + ',' + n(cy) + ' Z';
  }
  function circle(cx, cy, r) {
    return 'M' + n(cx - r) + ',' + n(cy) + ' a' + n(r) + ',' + n(r) + ' 0 1,0 ' + n(2 * r) + ',0 ' +
      'a' + n(r) + ',' + n(r) + ' 0 1,0 ' + n(-2 * r) + ',0 Z';
  }

    return list.map(function (p) { return circle(p.cx, p.cy, r); }).join(' ');
  }
  function triUp(cx, top, half, h) {
    return 'M' + n(cx) + ',' + n(top) + ' L' + n(cx + half) + ',' + n(top + h) + ' L' + n(cx - half) + ',' + n(top + h) + ' Z';
  }

  function parseColor(v, fallback) {
    if (typeof v === 'number' && isFinite(v)) return Math.max(0, Math.min(0xFFFFFF, v | 0));
    var s = String(v == null ? '' : v).trim().replace(/^#/, '');

  /* ---------- 计分条几何（单位：520 x 163） ---------- */
  var BASES = [

  var BALLS = [

  /* ck 字段表示该形状/文字的颜色取自 options 的哪个可配置色 */
  var STATIC_SHAPES = [

    { id: 'pBg',         d: roundRect(4, 4, 512, 152, 3),                 color: COLOR.bg,          z: 2 },
    { id: 'pAwayRow',    d: rect(5, 4, 167, 76),                           color: COLOR.bg,          ck: 'cAwayBg', z: 3 },
    { id: 'pHomeRow',    d: bottomRoundRect(5, 83, 167, 72, 4),           color: COLOR.blue,        ck: 'cHomeBg', z: 3 },
    { id: 'pRowB',       d: rect(350, 83, 165, 36),                        color: COLOR.bg,          ck: 'cCountBg', z: 3 },
    { id: 'pRowS',       d: bottomRoundRect(350, 119, 165, 36, 4),         color: COLOR.bg,          ck: 'cCountBg', z: 3 },
    { id: 'pLines',      d: join(rect(173, 4, 3, 152), rect(346, 4, 3, 152), rect(5, 80, 167, 2), rect(350, 80, 165, 2), rect(350, 118, 165, 1.5)), color: COLOR.line, z: 4 },
    { id: 'pMidLine',    d: rect(238, 8, 2, 144),                           color: COLOR.midLine,     z: 4 },
    { id: 'pBaseOff',    d: join(diamond(292, 45, 15), diamond(268, 68, 15), diamond(316, 68, 15)), color: COLOR.baseOff, z: 5, bw: 1, bc: 0x3E4150 },

    { id: 'pBase2On',    d: diamond(292, 45, 15),        color: COLOR.white,     ck: 'cBaseOn', z: 6, key: 'base2', bw: 1, bc: COLOR.baseEdge },
    { id: 'pBase3On',    d: diamond(268, 68, 15),        color: COLOR.white,     ck: 'cBaseOn', z: 6, key: 'base3', bw: 1, bc: COLOR.baseEdge },
    { id: 'pOut1On',     d: circle(263, 122, 7),         color: COLOR.white,     z: 6, key: 'out1' },
    { id: 'pOut2On',     d: circle(293, 122, 7),         color: COLOR.white,     z: 6, key: 'out2' },
    { id: 'pOut3On',     d: circle(323, 122, 7),         color: COLOR.white,     z: 6, key: 'out3' },
    { id: 'pBall1On',    d: circle(BALLS[0].cx, BALLS[0].cy, DOT_R), color: COLOR.countOn, z: 7, key: 'ball1' },
    { id: 'pBall2On',    d: circle(BALLS[1].cx, BALLS[1].cy, DOT_R), color: COLOR.countOn, z: 7, key: 'ball2' },
    { id: 'pBall3On',    d: circle(BALLS[2].cx, BALLS[2].cy, DOT_R), color: COLOR.countOn, z: 7, key: 'ball3' },
    { id: 'pStrike1On',  d: circle(STRIKES[0].cx, STRIKES[0].cy, DOT_R), color: COLOR.countOn, z: 7, key: 'strike1' },
    { id: 'pStrike2On',  d: circle(STRIKES[1].cx, STRIKES[1].cy, DOT_R), color: COLOR.countOn, z: 7, key: 'strike2' }
  ];

  var TEXT_DEFS = [
    { id: 'tAwayName',   x: 10,  y: 41,  ax: 0,   size: 48, color: COLOR.white,     ck: 'cAwayFg', get: function (s) { return s.awayName; } },
    { id: 'tAwayScore',  x: 158, y: 41,  ax: 1,   size: 52, color: COLOR.white,     ck: 'cAwayFg', get: function (s) { return String(s.awayScore); } },
    { id: 'tHomeName',   x: 10,  y: 122, ax: 0,   size: 48, color: COLOR.white,     ck: 'cHomeFg', get: function (s) { return s.homeName; } },
    { id: 'tHomeScore',  x: 158, y: 122, ax: 1,   size: 52, color: COLOR.white,     ck: 'cHomeFg', get: function (s) { return String(s.homeScore); } },
    { id: 'tInning',     x: 205, y: 82,  ax: 0.5, size: 54, color: COLOR.white,     get: function (s) { return String(s.inning); } },
    { id: 'tCount',      x: 432, y: 41,  ax: 0.5, size: 50, color: COLOR.white,     get: function (s) { return s.balls + '-' + s.strikes; } },
    { id: 'tBallLabel',  x: 358, y: 101, ax: 0,   size: 27, color: COLOR.white,     get: function () { return 'B'; } },
    { id: 'tStrikeLabel',x: 358, y: 137, ax: 0,   size: 27, color: COLOR.white,     get: function () { return 'S'; } },
    { id: 'tBallNum',    x: 502, y: 101, ax: 1,   size: 30, color: COLOR.white,     get: function (s) { return String(s.balls); } },
    { id: 'tStrikeNum',  x: 502, y: 137, ax: 1,   size: 30, color: COLOR.white,     get: function (s) { return String(s.strikes); } }
  ];

  /* ---------- 状态 → 各对象可变量的取值 ---------- */
  function overlayAlphas(s) {
    return {
      arrowUp:   s.half === 'top' ? 1 : 0,
      arrowDown: s.half === 'bottom' ? 1 : 0,
      base1:     s.b1 ? 1 : 0,
      base2:     s.b2 ? 1 : 0,
      base3:     s.b3 ? 1 : 0,
      out1:      s.outs >= 1 ? 1 : 0,
      out2:      s.outs >= 2 ? 1 : 0,
      out3:      s.outs >= 3 ? 1 : 0,
      ball1:     s.balls >= 1 ? 1 : 0,
      ball2:     s.balls >= 2 ? 1 : 0,
      ball3:     s.balls >= 3 ? 1 : 0,
      strike1:   s.strikes >= 1 ? 1 : 0,
      strike2:   s.strikes >= 2 ? 1 : 0
    };
  }

  function dynamicValues(s) {
    var v = {
      tAwayName:   { attr: 'content', raw: s.awayName,               fmt: basString(s.awayName) },
      tHomeName:   { attr: 'content', raw: s.homeName,               fmt: basString(s.homeName) },
      tAwayScore:  { attr: 'content', raw: String(s.awayScore),      fmt: basString(String(s.awayScore)) },
      tHomeScore:  { attr: 'content', raw: String(s.homeScore),      fmt: basString(String(s.homeScore)) },
      tInning:     { attr: 'content', raw: String(s.inning),         fmt: basString(String(s.inning)) },
      tCount:      { attr: 'content', raw: s.balls + '-' + s.strikes, fmt: basString(s.balls + '-' + s.strikes) },
      tBallNum:    { attr: 'content', raw: String(s.balls),          fmt: basString(String(s.balls)) },
      tStrikeNum:  { attr: 'content', raw: String(s.strikes),        fmt: basString(String(s.strikes)) }
    };
    var a = overlayAlphas(s);
    Object.keys(a).forEach(function (k) {
      var on = /^(base|out|ball|strike)/.test(k);
      var id = 'p' + k.charAt(0).toUpperCase() + k.slice(1) + (on ? 'On' : '');
      v[id] = { attr: 'alpha', raw: String(a[k]), fmt: String(a[k]) };
    });
    return v;
  }

  function basString(s) {
    return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/[\r\n]/g, ' ') + '"';
  }

  /* ---------- 坐标换算与四角定位 ---------- */
  function heightPct(widthPct) {
    return widthPct * (BOARD_H / BOARD_W) * (STAGE_W / STAGE_H);
  }
  function effectivePosition(o) {
    var w = Number(o.widthPct) || DEFAULT_OPTIONS.widthPct;
    var h = heightPct(w);
    var m = Number(o.marginPct === undefined ? DEFAULT_OPTIONS.marginPct : o.marginPct) || 0;
    var x = Number(o.xPct === undefined ? DEFAULT_OPTIONS.xPct : o.xPct);
    var y = Number(o.yPct === undefined ? DEFAULT_OPTIONS.yPct : o.yPct);
    switch (o.anchor) {
      case 'tl': x = m;                y = m;                break;
      case 'tr': x = 100 - w - m;      y = m;                break;
      case 'bl': x = m;                y = 100 - h - m;      break;
      case 'br': x = 100 - w - m;      y = 100 - h - m;      break;
      default: break; // custom：直接用 xPct / yPct
    }
    return { x: x, y: y, h: h, w: w };
  }
  function toPercent(v) { return (Math.round(v * 1000) / 1000) + '%'; }
  function bx(u, o) { return toPercent(o.effX + u * o.widthPct / BOARD_W); }
  function by(u, o) { return toPercent(o.effY + u * o.heightPct / BOARD_H); }
  function fs(u, o) { return toPercent(u * o.widthPct / BOARD_W); }

  /* ---------- 字号：可调缩放 + 队名/比分两位数自动避让 ---------- */
  var TEXT_BY_ID = {};
  TEXT_DEFS.forEach(function (t) { TEXT_BY_ID[t.id] = t; });
  var ROW_LEFT = 10, ROW_RIGHT = 158, MIN_GAP = 20;  // 队名左锚点 / 比分右锚点 / 目标最小间隙
  /* 20 是安全上限：队名 3 字 + 比分 1 位的估算宽 = 125.2 < 148-20 = 128，
     所以一位数比分仍保持原始字号，默认脚本逐字节不变；两位数才触发缩小。 */
  var NAME_W = 0.66, DIGIT_W = 0.58;                 // Arial Bold 粗估单字宽 / 字号

  function isName(t) { return t.id === 'tAwayName' || t.id === 'tHomeName'; }
  function isScore(t) { return t.id === 'tAwayScore' || t.id === 'tHomeScore'; }
  function clampScale(v, dflt) {
    var x = Number(v);
    if (!isFinite(x) || x <= 0) x = dflt;
    return Math.max(60, Math.min(140, x));
  }
  function baseTextSize(t, s, o) {
    var size = t.size * o.fontScale / 100;
    if (isName(t) || isScore(t)) size *= o.nameScoreScale / 100;
    if (isName(t)) {
      var name = String(t.id === 'tAwayName' ? s.awayName : s.homeName);
      if (name.length > 3) size = Math.max(20, size * 3 / name.length);
    }
    return size;
  }
  /* 一行里「队名 + 比分」的估算宽度超出可用宽度时，两者一起等比缩小 */
  function rowFit(s, o, away) {
    if (!o.autoFit) return 1;
    var nT = TEXT_BY_ID[away ? 'tAwayName' : 'tHomeName'];
    var cT = TEXT_BY_ID[away ? 'tAwayScore' : 'tHomeScore'];
    var name = String(away ? s.awayName : s.homeName);
    var score = String(away ? s.awayScore : s.homeScore);
    var w = name.length * NAME_W * baseTextSize(nT, s, o) +
            score.length * DIGIT_W * baseTextSize(cT, s, o);
    var avail = ROW_RIGHT - ROW_LEFT - MIN_GAP;
    return w > avail ? Math.max(0.55, avail / w) : 1;
  }
  function textSize(t, s, o) {
    var size = baseTextSize(t, s, o);
    if (isName(t) || isScore(t)) size *= rowFit(s, o, /Away/.test(t.id));
    return Math.round(size * 10) / 10;
  }
  /* BAS 的 fontSize 写在 def 里、时间轴只能改 content，所以按所有快照中
     「队名最长 / 比分位数最多」的状态固化字号，保证后续变成两位数时也不会挤。 */
  function worstFitState(initial, events) {
    var s = Object.assign({}, initial);
    buildSnapshots(initial, events).forEach(function (snap) {
      var st = snap.state;
      if (String(st.awayName).length > String(s.awayName).length) s.awayName = st.awayName;
      if (String(st.homeName).length > String(s.homeName).length) s.homeName = st.homeName;
      if (String(st.awayScore).length > String(s.awayScore).length) s.awayScore = st.awayScore;
      if (String(st.homeScore).length > String(s.homeScore).length) s.homeScore = st.homeScore;
    });
    return s;
  }
  function fontSizes(state, options) {
    var s = Object.assign({}, DEFAULT_STATE, state || {});
    var o = normalizeOptions(options);
    return {
      awayName: textSize(TEXT_BY_ID.tAwayName, s, o),
      awayScore: textSize(TEXT_BY_ID.tAwayScore, s, o),
      homeName: textSize(TEXT_BY_ID.tHomeName, s, o),
      homeScore: textSize(TEXT_BY_ID.tHomeScore, s, o)
    };
  }

  /* ---------- BAS 脚本生成 ---------- */
  function shapeColor(sh, o) { return sh.ck ? o[sh.ck] : sh.color; }
  function textColor(t, o) { return t.ck ? o[t.ck] : t.color; }

  function pathDef(shape, o, alpha) {
    var L = [];
    L.push('def path ' + shape.id + ' {');
    L.push('    d = "' + shape.d + '"');
    L.push('    viewBox = "0 0 520 163"');
    L.push('    width = ' + toPercent(o.widthPct));
    L.push('    height = ' + toPercent(o.heightPct));
    L.push('    x = ' + toPercent(o.effX));
    L.push('    y = ' + toPercent(o.effY));
    L.push('    fillColor = ' + hexNum(shapeColor(shape, o)));
    if (shape.bw) {
      L.push('    borderWidth = ' + shape.bw);
      L.push('    borderColor = ' + hexNum(shape.bc));
    }
    if (alpha !== undefined) L.push('    alpha = ' + alpha);
    L.push('    zIndex = ' + shape.z);
    L.push('    duration = ' + o.duration);
    L.push('}');
    return L.join('\n');
  }

  function textDef(t, state, o, fitState) {
    var L = [];
    L.push('def text ' + t.id + ' {');
    L.push('    content = ' + basString(t.get(state)));
    L.push('    x = ' + bx(t.x, o));
    L.push('    y = ' + by(t.y, o));
    L.push('    anchorX = ' + t.ax);
    L.push('    anchorY = 0.5');
    /* content 取当前状态，fontSize 取时间轴最宽状态（生成时固化） */
    L.push('    fontSize = ' + fs(textSize(t, fitState || state, o), o));
    L.push('    fontFamily = "Arial"');
    L.push('    color = ' + hexNum(textColor(t, o)));
    L.push('    bold = 1');
    L.push('    textShadow = 0');
    L.push('    zIndex = 9');
    L.push('    duration = ' + o.duration);
    L.push('}');
    return L.join('\n');
  }

  function normalizeOptions(o) {
    o = o || {};
    var r = {
      widthPct: Number(o.widthPct || DEFAULT_OPTIONS.widthPct),
      xPct: Number(o.xPct === undefined ? DEFAULT_OPTIONS.xPct : o.xPct),
      yPct: Number(o.yPct === undefined ? DEFAULT_OPTIONS.yPct : o.yPct),
      anchor: o.anchor || DEFAULT_OPTIONS.anchor,
      marginPct: Number(o.marginPct === undefined ? DEFAULT_OPTIONS.marginPct : o.marginPct),
      duration: o.duration || DEFAULT_OPTIONS.duration,
      cAwayBg: parseColor(o.awayBg, 0x0B0B0C),
      cAwayFg: parseColor(o.awayFg, 0xFFFFFF),
      cHomeBg: parseColor(o.homeBg, 0x2C51C2),
      cHomeFg: parseColor(o.homeFg, 0xFFFFFF),
      cCountBg: parseColor(o.countBg, 0x0B0B0C),
      cBaseOn: parseColor(o.baseOn, 0xFFFFFF),
      fontScale: clampScale(o.fontScale, 100),
      nameScoreScale: clampScale(o.nameScoreScale, 100),
      autoFit: o.autoFit === undefined ? true :
        (o.autoFit === true || o.autoFit === 1 || o.autoFit === '1' || o.autoFit === 'true')
    };
    var p = effectivePosition(r);
    r.effX = p.x; r.effY = p.y; r.heightPct = p.h;
    return r;
  }

  function applyPatch(state, field, value) {
    var s = Object.assign({}, state);
    var v = String(value).trim();
    switch (field) {
      case 'awayName': case 'homeName': s[field] = v.slice(0, 8); break;
      case 'awayScore': case 'homeScore': case 'inning': case 'outs': case 'balls': case 'strikes':
        s[field] = Math.max(0, parseInt(v, 10) || 0); break;
      case 'half':
        s.half = (v === '上' || v === 'top' || v === '1') ? 'top' : 'bottom'; break;
      case 'b1': case 'b2': case 'b3':
        s[field] = (v === '0' || v === '无' || v === 'false' || v === '') ? 0 : 1; break;
    }
    return s;
  }

  function buildSnapshots(initial, events) {
    var list = (events || []).slice().filter(function (e) { return e && e.field && e.t !== ''; })
      .map(function (e) { return { t: Math.max(0, Number(e.t) || 0), field: e.field, value: e.value }; })
      .sort(function (a, b) { return a.t - b.t; });
    var snaps = [{ t: 0, state: Object.assign({}, initial) }];
    list.forEach(function (e) {
      snaps.push({ t: e.t, state: applyPatch(snaps[snaps.length - 1].state, e.field, e.value) });
    });
    return snaps;
  }

  function generateChains(initial, events) {
    var snaps = buildSnapshots(initial, events);
    if (snaps.length < 2) return '';
    var targets = Object.keys(dynamicValues(initial));
    var chains = [];
    targets.forEach(function (target) {
      var prev = dynamicValues(snaps[0].state)[target];
      var steps = [];
      var cursor = 0;
      snaps.slice(1).forEach(function (snap) {
        var cur = dynamicValues(snap.state)[target];
        if (cur.raw !== prev.raw) {
          steps.push({ wait: Math.max(0.01, snap.t - cursor), attr: cur.attr, val: cur.fmt });
          cursor = snap.t;
          prev = cur;
        }
      });
      if (!steps.length) return;
      var L = [];
      steps.forEach(function (st, i) {
        var head = i === 0 ? 'set ' : 'then set ';
        L.push(head + target + ' {} ' + (Math.round(st.wait * 1000) / 1000) + 's');
        L.push('then set ' + target + ' { ' + st.attr + ' = ' + st.val + ' } 0.01s');
      });
      chains.push(L.join('\n'));
    });
    return chains.length ? '\n' + chains.join('\n\n') + '\n' : '';
  }

  function generateBAS(state, options, events) {
    var s = Object.assign({}, DEFAULT_STATE, state || {});
    var o = normalizeOptions(options);
    var alphas = overlayAlphas(s);
    var fitState = worstFitState(s, events || []);
    var blocks = [];

    STATIC_SHAPES.forEach(function (sh) { blocks.push(pathDef(sh, o)); });
    OVERLAY_SHAPES.forEach(function (sh) { blocks.push(pathDef(sh, o, alphas[sh.key])); });
    TEXT_DEFS.forEach(function (t) { blocks.push(textDef(t, s, o, fitState)); });

    return blocks.join('\n\n') + '\n' + generateChains(s, events || []);
  }

  /* ---------- SVG 预览生成（与 BAS 使用同一套几何 / 同一套配色） ---------- */
  /* preview.fieldBg === false 时输出透明背景，便于叠加到视频画面上 */
  function renderSVG(state, options, preview) {
    var s = Object.assign({}, DEFAULT_STATE, state || {});
    var o = normalizeOptions(options);
    var fieldBg = !preview || preview.fieldBg !== false;
    var fitState = (preview && preview.fitState) || s;
    var scale = o.widthPct / 52;
    var tx = o.effX * 10, ty = o.effY * 5.625;
    var alphas = overlayAlphas(s);
    var out = [];

    if (fieldBg) {
      out.push('<defs>');
      out.push('<linearGradient id="fieldBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17233a"/><stop offset="0.55" stop-color="#1d3b2a"/><stop offset="1" stop-color="#2c5b34"/></linearGradient>');
      out.push('<radialGradient id="vignette" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/></radialGradient>');
      out.push('</defs>');
      out.push('<rect x="0" y="0" width="1000" height="562.5" fill="url(#fieldBg)"/>');
      out.push('<path d="M500,250 L650,340 L500,430 L350,340 Z" fill="#000" opacity="0.08"/>');
      out.push('<rect x="0" y="0" width="1000" height="562.5" fill="url(#vignette)"/>');
    }
    out.push('<g transform="translate(' + n(tx) + ',' + n(ty) + ') scale(' + n(scale) + ')">');

    STATIC_SHAPES.forEach(function (sh) { out.push(svgPath(sh, 1, o)); });
    OVERLAY_SHAPES.forEach(function (sh) { out.push(svgPath(sh, alphas[sh.key], o)); });
    TEXT_DEFS.forEach(function (t) {
      var anchor = t.ax === 0 ? 'start' : (t.ax === 1 ? 'end' : 'middle');
      out.push('<text x="' + t.x + '" y="' + t.y + '" font-size="' + textSize(t, fitState, o) + '" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="' + hex(textColor(t, o)) + '" text-anchor="' + anchor + '" dominant-baseline="central">' + escapeXML(t.get(s)) + '</text>');
    });
    out.push('</g>');
    return out.join('\n');
  }

  function svgPath(sh, alpha, o) {
    if (!alpha) return '';
    var s = '<path d="' + sh.d + '" fill="' + hex(shapeColor(sh, o)) + '"';
    if (sh.bw) s += ' stroke="' + hex(sh.bc) + '" stroke-width="' + sh.bw + '"';
    return s + '/>';
  }
  function escapeXML(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function stateAtTime(initial, events, t) {
    var snaps = buildSnapshots(initial, events);
    var state = snaps[0].state;
    for (var i = 1; i < snaps.length; i++) if (snaps[i].t <= t) state = snaps[i].state;
    return state;
  }

  return {
    BOARD_W: BOARD_W, BOARD_H: BOARD_H, STAGE_W: STAGE_W, STAGE_H: STAGE_H,
    DEFAULT_STATE: DEFAULT_STATE, DEFAULT_OPTIONS: DEFAULT_OPTIONS, EVENT_FIELDS: EVENT_FIELDS,
    COLOR: COLOR,
    generateBAS: generateBAS,
    renderSVG: renderSVG,
    applyPatch: applyPatch,
    buildSnapshots: buildSnapshots,
    stateAtTime: stateAtTime,
    overlayAlphas: overlayAlphas,
    effectivePosition: effectivePosition,
    heightPct: heightPct,
    fontSizes: fontSizes,
    worstFitState: worstFitState,
    hex: hex
  };
});

<script>
/* 线上房间中继客户端：WebSocket 优先，HTTP 长轮询兜底。
 * 只有在调用 connect() 后才会发起连接；服务端会按连接绑定的房间号二次校验，
 * 客户端也会丢弃房间号不匹配的推送，双保险防止多人使用时串台。
 * RELAY-CLIENT-START / END 标记供发布检查脚本识别「唯一允许联网的代码块」。
 */
/* RELAY-CLIENT-START */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else if (root) root.ScorebugRelay = api;
})(typeof window !== 'undefined' ? window : null, function () {
  'use strict';

  function splitServer(s) {
    s = String(s || '').trim().replace(/\/+$/, '');
    if (!s) {
      if (typeof location !== 'undefined' && /^https?:$/.test(location.protocol)) s = location.origin;
      else return { base: '', ticket: '' };
    }
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try {
      var u = new URL(s);
      return { base: u.origin, ticket: u.searchParams.get('sharecode') || '' };
    } catch (e) { return { base: s, ticket: '' }; }
  }
  function normServer(s) { return splitServer(s).base; }
  function pageTicket() {
    if (typeof location === 'undefined' || !location.search) return '';
    try { return new URLSearchParams(location.search).get('sharecode') || ''; } catch (e) { return ''; }
  }
  function withTicket(url, ticket) {
    if (!ticket) return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'sharecode=' + encodeURIComponent(ticket);
  }
  function normRoom(r) {
    return String(r || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  }
  function randomPeer() {
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    try {
      var w = typeof window !== 'undefined' ? window : null;
      var c = w && (w.crypto || w.msCrypto);
      if (!c || !c.getRandomValues) throw new Error('no crypto');
      var b = new Uint8Array(10);
      c.getRandomValues(b);
      for (var i = 0; i < 10; i++) s += a[b[i] % a.length];
    } catch (e) { for (var j = 0; j < 10; j++) s += a[Math.floor(Math.random() * a.length)]; }
    return s;
  }
  function wsUrl(server, cfg, ticket) {
    var url = server.replace(/^http/i, 'ws') + '/ws?room=' + encodeURIComponent(cfg.room) +
      '&role=' + cfg.role + '&peer=' + encodeURIComponent(cfg.peer) +
      (cfg.key ? '&key=' + encodeURIComponent(cfg.key) : '');
    return withTicket(url, ticket);
  }

  function create(cfg) {
    cfg = cfg || {};
    var parsed = splitServer(cfg.server);
    var server = parsed.base;
    var ticket = cfg.ticket || parsed.ticket || pageTicket();
    var room = normRoom(cfg.room);
    var role = cfg.role === 'controller' ? 'controller' : 'viewer';
    var key = cfg.key || '';
    var peer = cfg.peer || randomPeer();
    var stopped = false, ws = null, pollAbort = null, retryTimer = null;
    var since = 0, queue = [], transport = 'offline', connected = false, lastError = '';

    function emit() {
      if (cfg.onStatus) cfg.onStatus({
        connected: connected, transport: transport, room: room, server: server, detail: lastError
      });
    }
    function deliver(m) {
      if (!m || typeof m !== 'object') return;
      if (m.room && normRoom(m.room) !== room) return;   // 房间不符直接丢弃
      if (m.from && m.from === peer) return;             // 忽略自己发出的回声
      if (typeof m.seq === 'number') since = Math.max(since, m.seq);
      if (cfg.onMessage) cfg.onMessage(m);
    }
    function flush() {
      if (!ws || ws.readyState !== 1) return;
      while (queue.length) {
        try { ws.send(JSON.stringify(queue.shift())); } catch (e) { break; }
      }
    }
    function send(m) {
      if (stopped) return false;
      m = m || {};
      /* 不携带 room/key：房间归属完全由服务端按连接决定，杜绝伪造跨房间消息 */
      var out = { type: m.type, payload: m.payload, t: m.t, from: peer };
      if (transport === 'ws' && ws && ws.readyState === 1) {
        try { ws.send(JSON.stringify(out)); return true; } catch (e) {}
      } else if (transport === 'poll') {
        pushHttp(out); return true;
      }
      if (queue.length < 12) queue.push(out);
      return false;
    }
    function pushHttp(out) {
      var body = JSON.stringify({
        room: room, role: role, key: key, peer: peer,
        type: out.type, payload: out.payload, t: out.t, from: out.from
      });
      fetch(withTicket(server + '/api/push', ticket), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.error) { lastError = j.error; emit(); }
      }).catch(function (e) { lastError = '推送失败：' + e.message; emit(); });
    }
    function pollLoop() {
      if (stopped || transport !== 'poll') return;
      pollAbort = new AbortController();
      fetch(withTicket(server + '/api/poll?room=' + encodeURIComponent(room) +
            '&role=' + role + '&peer=' + encodeURIComponent(peer) + '&since=' + since, ticket),
            { signal: pollAbort.signal })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          (j.messages || []).forEach(deliver);
          if (j.presence) deliver(j.presence);
          pollLoop();
        })
        .catch(function (e) {
          if (stopped || e.name === 'AbortError') return;
          lastError = '轮询中断，稍后重试'; emit();
          retryTimer = setTimeout(pollLoop, 1500);
        });
    }
    function startPolling(reason) {
      if (stopped || transport === 'poll') return;
      transport = 'poll'; connected = true;
      lastError = reason ? 'WebSocket 不可用，已切换 HTTP 长轮询' : '';
      emit(); flushHttpQueue(); pollLoop();
    }
    function flushHttpQueue() {
      while (queue.length) pushHttp(queue.shift());
    }
    function connect() {
      if (stopped) return;
      if (!server || !room) {
        lastError = '缺少房间号或中继地址'; transport = 'offline'; connected = false; emit(); return;
      }
      if (typeof WebSocket === 'undefined') { startPolling('浏览器不支持 WebSocket'); return; }
      var opened = false;
      try { ws = new WebSocket(wsUrl(server, { room: room, role: role, key: key, peer: peer }, ticket)); }
      catch (e) { startPolling(e.message); return; }
      var t = setTimeout(function () {
        if (!opened && !stopped) { try { ws.close(); } catch (e) {} startPolling('连接超时'); }
      }, 4000);
      ws.onopen = function () {
        if (stopped) return;
        opened = true; clearTimeout(t); transport = 'ws'; connected = true; lastError = ''; emit(); flush();
      };
      ws.onmessage = function (ev) { try { deliver(JSON.parse(ev.data)); } catch (e) {} };
      ws.onerror = function () {};
      ws.onclose = function () {
        clearTimeout(t);
        if (stopped) return;
        if (!opened) { startPolling('WebSocket 被拒绝'); return; }
        connected = false; transport = 'reconnecting'; lastError = '连接断开，正在重连'; emit();
        retryTimer = setTimeout(function () { if (!stopped && transport !== 'poll') connect(); }, 1800);
      };
    }
    function close() {
      stopped = true; connected = false; transport = 'offline';
      clearTimeout(retryTimer);
      if (pollAbort) { try { pollAbort.abort(); } catch (e) {} }
      if (ws) { try { ws.close(); } catch (e) {} }
      ws = null; queue.length = 0;
      emit();
    }
    return {
      connect: connect, close: close, send: send, peer: peer,
      status: function () {
        return { connected: connected, transport: transport, room: room, server: server, detail: lastError };
      }
    };
  }

  return {
    create: create, normServer: normServer, splitServer: splitServer,
    normRoom: normRoom, randomPeer: randomPeer, pageTicket: pageTicket
  };
});
/* RELAY-CLIENT-END */

</script>
<script>
(function(){
  'use strict';
  var G = window.ScorebugBAS, R = window.ScorebugRelay;
  var $ = function(id){ return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var parsed = q.get('relay') ? R.splitServer(q.get('relay')) : { base:'', ticket:'' };
  var sameOrigin = /^https?:$/.test(location.protocol) ? location.origin : '';
  var server = parsed.base || sameOrigin;
  var ticket = parsed.ticket || R.pageTicket();
  var room = R.normRoom(q.get('room'));
  var keyValue = q.get('key') || '';
  var readOnly = true, relay = null, stateTimer = null, syncTimer = null;
  var presenceText = '', lastLocalEdit = 0, toastTimer = null, tSec = 0;

  $('serverInput').value = server;
  $('roomInput').value = room;
  $('keyInput').value = keyValue;

  var payload = {
    room: room,
    state: Object.assign({}, G.DEFAULT_STATE),
    events: [],
    options: Object.assign({}, G.DEFAULT_OPTIONS),
    duration: 600,
    t: 0
  };

  function ticketUrl(u){
    if (!ticket) return u;
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'sharecode=' + encodeURIComponent(ticket);
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function fmt(t){
    t = Math.max(0, Math.floor(t));
    var h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
    var p = function(v){ return ('0' + v).slice(-2); };
    return (h ? p(h) + ':' : '') + p(m) + ':' + p(s);
  }
  function toast(msg, warn){
    var el = $('toast');
    el.textContent = msg;
    el.style.borderColor = warn ? '#ffbd66' : '#4a6086';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }
  function buzz(){ try { if ($('vibrate').checked && navigator.vibrate) navigator.vibrate(8); } catch(e){} }
  function randomRoom(){
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    try {
      var b = new Uint8Array(6); (window.crypto || window.msCrypto).getRandomValues(b);
      for (var i = 0; i < 6; i++) s += a[b[i] % a.length];
    } catch(e){ for (var j = 0; j < 6; j++) s += a[Math.floor(Math.random() * a.length)]; }
    return s;
  }

  /* ---------- 渲染：所有控件都由同一份 state 驱动 ---------- */
  function setInput(id, v){
    var el = $(id);
    if (document.activeElement !== el) el.value = v;
  }
  function markGroup(container, attr, value){
    Array.prototype.forEach.call(container.querySelectorAll('button[' + attr + ']'), function(b){
      var on = b.getAttribute(attr) === String(value);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  function buildDots(){
    var specs = [ ['ballDots', 'balls', 3, 'act', 'balls'],
                  ['strikeDots', 'strikes', 2, 'act', 'strikes'],
                  ['outDots', 'outs', 2, 'act', 'outs'] ];
    specs.forEach(function(sp){
      var box = $(sp[0]), html = '';
      for (var i = 0; i <= sp[2]; i++)
        html += '<button class="dot" data-act="' + sp[4] + '" data-n="' + i + '" aria-label="' + sp[1] + '设为' + i + '">' + i + '</button>';
      box.innerHTML = html;
    });
  }
  function renderAll(){
    var s = payload.state;
    setInput('awayName', s.awayName);
    setInput('homeName', s.homeName);
    $('awayScore').textContent = s.awayScore;
    $('homeScore').textContent = s.homeScore;
    $('inningVal').textContent = s.inning;
    markGroup($('halfSeg'), 'data-half', s.half);
    markGroup($('ballDots'), 'data-n', s.balls);
    markGroup($('strikeDots'), 'data-n', s.strikes);
    markGroup($('outDots'), 'data-n', s.outs);
    Array.prototype.forEach.call($('bases').querySelectorAll('button'), function(b){
      var on = !!s[b.getAttribute('data-field')];
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    tSec = Math.max(0, Number(payload.t) || 0);
    $('tVal').textContent = fmt(tSec);
    $('roomLabel').textContent = room ? '房间 ' + room : '未加入房间';
    try {
      var fit = G.worstFitState(payload.state, payload.events);
      $('preview').innerHTML = G.renderSVG(payload.state, payload.options, { fieldBg:false, fitState: fit });
    } catch(e){ toast('预览渲染失败：' + e.message, true); }
  }
  function setControlEnabled(on){
    $('controlArea').classList.toggle('locked-ui', !on);
    Array.prototype.forEach.call($('controlArea').querySelectorAll('button'), function(b){ b.disabled = !on; });
  }
  function setLink(s){
    var t = s.transport === 'ws' ? 'WebSocket' :
            (s.transport === 'poll' ? 'HTTP 长轮询' : (s.transport === 'reconnecting' ? '重连中' : '离线'));
    var el = $('linkInfo'), tag = $('roleTag');
    el.className = 'link ' + (s.connected ? 'on' : 'off');
    el.textContent = (s.connected ? '已连接' : '未连接') + ' · 房间 ' + (s.room || '—') + ' · ' + t +
      (presenceText ? ' · ' + presenceText : '') + (s.detail ? ' · ' + s.detail : '');
    tag.className = 'tag ' + (s.connected ? (readOnly ? 'read' : 'on') : '');
    tag.textContent = s.connected ? (readOnly ? '只读观看' : '可控制') : '未连接';
    if (s.detail && s.detail.indexOf('控制密钥') >= 0)
      toast(s.detail + '：请核对密钥，或留空以只读观看', true);
  }
  function applyRemote(p, quiet){
    if (!p || typeof p !== 'object') return;
    payload = {
      room: room,
      state: Object.assign({}, G.DEFAULT_STATE, p.state || {}),
      events: Object.prototype.toString.call(p.events) === '[object Array]' ? p.events : [],
      options: Object.assign({}, G.DEFAULT_OPTIONS, p.options || {}),
      duration: Math.max(1, Number(p.duration) || 600),
      t: Math.max(0, Number(p.t) || 0)
    };
    renderAll();
    if (!quiet) toast('已同步房间 ' + room + ' 的最新比分');
  }

  /* ---------- 推送 ---------- */
  function pushState(){
    if (!relay || readOnly) return;
    lastLocalEdit = Date.now();
    payload.room = room; payload.t = tSec;
    if (stateTimer) return;
    stateTimer = setTimeout(function(){
      stateTimer = null;
      if (relay) relay.send({ type:'state', payload: payload });
    }, 120);
  }
  function pushSync(){
    if (!relay || readOnly) return;
    if (syncTimer) return;
    syncTimer = setTimeout(function(){
      syncTimer = null;
      if (relay) relay.send({ type:'sync', t: tSec });
    }, 160);
  }
  function pushNow(){
    if (!relay || readOnly){ toast('尚未以控制身份加入房间', true); return; }
    if (stateTimer){ clearTimeout(stateTimer); stateTimer = null; }
    payload.room = room; payload.t = tSec;
    relay.send({ type:'state', payload: payload });
    relay.send({ type:'sync', t: tSec });
    toast('已向房间 ' + room + ' 推送当前比分与时间');
  }
  function changed(){ renderAll(); pushState(); }

  /* ---------- 房间列表 / 最近状态 ---------- */
  function renderChips(list){
    var box = $('roomChips');
    if (!list || !list.length){
      box.innerHTML = '<span class="empty">暂时没有在线房间；可以自己输入房间号新建。</span>';
      return;
    }
    box.innerHTML = list.map(function(r){
      return '<button class="chip' + (r.id === room ? ' on' : '') + (r.locked ? ' locked' : '') +
        '" data-act="chip" data-room="' + esc(r.id) + '" data-locked="' + (r.locked ? 1 : 0) + '">' +
        esc(r.id) + '<small>' + (r.locked ? '需控制密钥 · ' : '开放控制 · ') +
        '控制 ' + r.controllers + ' / 观看 ' + r.viewers + '</small></button>';
    }).join('');
  }
  function loadRooms(){
    if (!server){ $('roomChips').innerHTML = '<span class="empty">请填写中继地址后再刷新房间</span>'; return; }
    fetch(ticketUrl(server + '/api/rooms'), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){ renderChips(j.rooms || []); })
      .catch(function(e){ $('roomChips').innerHTML = '<span class="empty">房间列表读取失败：' + esc(e.message) + '</span>'; });
  }
  function loadRoomState(id){
    if (!server) return;
    fetch(ticketUrl(server + '/api/state?room=' + encodeURIComponent(id)), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.state) return;
        if (j.state.room && R.normRoom(j.state.room) !== id) return;
        applyRemote(j.state, true);
      })
      .catch(function(){});
  }

  /* ---------- 加入 / 断开 ---------- */
  function join(){
    server = R.normServer($('serverInput').value) || server;
    if (!server){ toast('请填写中继地址（从线上服务打开时会自动填好）', true); return; }
    var rm = R.normRoom($('roomInput').value) || randomRoom();
    if (rm.length < 4){ toast('房间号至少 4 位，只能用字母和数字', true); return; }
    room = rm; $('roomInput').value = rm;
    keyValue = $('keyInput').value.trim();
    readOnly = !keyValue;
    if (relay){ try { relay.close(); } catch(e){} relay = null; }
    presenceText = '';
    relay = R.create({
      server: server, room: room, role: readOnly ? 'viewer' : 'controller',
      key: keyValue, ticket: ticket,
      onStatus: setLink,
      onMessage: function(m){
        if (m.type === 'presence'){
          presenceText = '控制器 ' + m.controllers + ' / 观看 ' + m.viewers;
          if (relay) setLink(relay.status());
        } else if (m.type === 'state' && m.payload){
          if (Date.now() - lastLocalEdit > 600) applyRemote(m.payload, true);
        } else if (m.type === 'error'){
          toast('中继返回：' + (m.message || m.error || '错误'), true);
        }
      }
    });
    setControlEnabled(!readOnly);
    relay.connect();
    loadRoomState(room);
    pushState(); pushSync();
    toast(readOnly ? '已只读加入房间 ' + room + '，填控制密钥后重新加入即可控制'
                   : '已加入房间 ' + room + '，现在可以改比分');
    loadRooms();
  }
  function leave(){
    if (relay){ try { relay.close(); } catch(e){} relay = null; }
    presenceText = '';
    readOnly = true;
    setControlEnabled(true);   /* 断开后仍可本地预编辑，只是不再推送 */
    setLink({ connected:false, transport:'offline', room:room, detail:'' });
    toast('已断开房间；仍可在本地调整，加入后才会推送');
  }

  /* ---------- 地址复制 ---------- */
  function overlayUrl(){
    var page = server ? server + '/live-overlay.html' : 'live-overlay.html';
    var u = page + '?room=' + encodeURIComponent(room) + '&panel=0';
    if (ticket) u += '&sharecode=' + encodeURIComponent(ticket);
    if (server && server !== location.origin) u += '&relay=' + encodeURIComponent(server);
    return u;
  }
  function mobileUrl(){
    var u = (server || location.origin) + '/mobile-control.html?room=' + encodeURIComponent(room);
    if (keyValue) u += '&key=' + encodeURIComponent(keyValue);
    if (ticket) u += '&sharecode=' + encodeURIComponent(ticket);
    return u;
  }
  function copyText(text, msg, warn){
    var done = function(){ toast(msg, warn); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); }
    catch(e){ toast('复制失败，请手动长按选择地址', true); }
    ta.remove();
  }

  /* ---------- 手指操作：事件委托，全部按钮 ≥44px ---------- */
  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (!act) return;
    buzz();
    var s = payload.state, n;
    switch (act){
      case 'refresh': loadRooms(); toast('正在刷新房间列表'); break;
      case 'random': $('roomInput').value = randomRoom(); toast('已生成新房间号，点「加入房间」即可创建'); break;
      case 'toggleKey':
        var ki = $('keyInput');
        ki.type = ki.type === 'password' ? 'text' : 'password';
        $('btnToggleKey').textContent = ki.type === 'password' ? '显示' : '隐藏';
        break;
      case 'chip':
        $('roomInput').value = b.getAttribute('data-room');
        room = R.normRoom(b.getAttribute('data-room'));
        if (b.getAttribute('data-locked') === '1' && !$('keyInput').value.trim())
          toast('该房间已设控制密钥：将以只读观看加入；填入密钥后重新加入即可控制', true);
        join();
        break;
      case 'join': join(); break;
      case 'leave': leave(); break;
      case 'score':
        s[b.getAttribute('data-field')] = Math.max(0, Number(s[b.getAttribute('data-field')]) + Number(b.getAttribute('data-delta')));
        changed(); break;
      case 'inning':
        s.inning = Math.max(1, Math.min(99, Number(s.inning) + Number(b.getAttribute('data-delta'))));
        changed(); break;
      case 'half': s.half = b.getAttribute('data-half'); changed(); break;
      case 'balls': s.balls = Number(b.getAttribute('data-n')); changed(); break;
      case 'strikes': s.strikes = Number(b.getAttribute('data-n')); changed(); break;
      case 'outs': s.outs = Number(b.getAttribute('data-n')); changed(); break;
      case 'base':
        n = b.getAttribute('data-field'); s[n] = s[n] ? 0 : 1; changed(); break;
      case 'quick':
        n = b.getAttribute('data-kind');
        if (n === 'ball1') s.balls = Math.min(3, Number(s.balls) + 1);
        else if (n === 'strike1') s.strikes = Math.min(2, Number(s.strikes) + 1);
        else if (n === 'out1') s.outs = Math.min(2, Number(s.outs) + 1);
        else if (n === 'clearCount'){ s.balls = 0; s.strikes = 0; }
        else if (n === 'clearBases'){ s.b1 = s.b2 = s.b3 = 0; }
        else if (n === 'nextHalf'){
          if (s.half === 'top') s.half = 'bottom';
          else { s.half = 'top'; s.inning = Math.max(1, Number(s.inning)) + 1; }
          s.balls = 0; s.strikes = 0; s.outs = 0; s.b1 = s.b2 = s.b3 = 0;
        }
        changed(); break;
      case 'time':
        tSec = Math.max(0, tSec + Number(b.getAttribute('data-delta')));
        payload.t = tSec; renderAll(); pushSync(); pushState(); break;
      case 'syncNow': pushNow(); break;
      case 'copyOverlay':
        if (!room){ toast('请先加入或输入房间号', true); break; }
        copyText(overlayUrl(), '已复制叠加层地址，粘贴到 OBS 浏览器源即可'); break;
      case 'copyMobile':
        copyText(mobileUrl(), keyValue ? '已复制本页地址（含密钥，只发给自己，不要公开分享）' : '已复制本页地址', !!keyValue); break;
    }
  }, false);

  ['awayName', 'homeName'].forEach(function(id){
    $(id).addEventListener('input', function(){
      payload.state[id] = this.value.slice(0, 10);
      renderAll(); pushState();
    });
  });
  $('roomInput').addEventListener('input', function(){
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  });
  $('serverInput').addEventListener('change', function(){
    server = R.normServer(this.value) || sameOrigin;
    this.value = server;
    loadRooms();
  });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') loadRooms();
  });

  buildDots();
  renderAll();
  setControlEnabled(true);   /* 未加入时允许先摆好比分，加入房间后再推送 */
  loadRooms();
  setInterval(function(){ if (document.visibilityState === 'visible') loadRooms(); }, 12000);
  if (room) setTimeout(join, 320);   /* 从「手机控制地址」打开时自动加入，少一步操作 */
})();
</script>
</body>
</html>
